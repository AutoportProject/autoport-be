spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:3000/auth/github/callback}

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Autoport <onboarding@resend.dev>}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
