spring.application.name=autoport

server.port=${PORT:8080}
server.address=0.0.0.0

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://dpg-d7s21hkm0tmc738l7iag-a.singapore-postgres.render.com/autoport_db_q8rl}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Resend Email
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Autoport <onboarding@resend.dev>}

# GitHub OAuth
github.client-id=${GITHUB_CLIENT_ID:}
github.client-secret=${GITHUB_CLIENT_SECRET:}
github.redirect-uri=${GITHUB_REDIRECT_URI:}
